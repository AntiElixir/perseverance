<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人计时器</title>
    <style>
        /* 消除浏览器默认边距 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; /* 纯黑背景 */
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center;    /* 垂直居中 */
            font-family: 'Courier New', Courier, monospace; /* 等宽字体，防止数字跳动 */
            overflow: hidden;       /* 隐藏滚动条 */
        }

        /* 计时器文字样式 */
        .timer-display {
            font-size: 6rem;        /* 字体大小，可根据喜好调整 */
            color: #ffffff;         /* 纯白文字 */
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2); /* 淡淡的发光效果 */
            letter-spacing: 2px;
        }

        /* 手机端自适应缩小字体 */
        @media (max-width: 600px) {
            .timer-display {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>

    <div id="timer" class="timer-display">00:00:00</div>

    <script>
        // 记录页面加载时的时间戳
        const startTime = Date.now();

        function updateTimer() {
            // 计算过去的总毫秒数
            const elapsedTime = Date.now() - startTime;

            // 换算为时、分、秒
            const totalSeconds = Math.floor(elapsedTime / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            // 格式化输出，保证始终是两位数（例如 05:09:01）
            const formatHours = String(hours).padStart(2, '0');
            const formatMinutes = String(minutes).padStart(2, '0');
            const formatSeconds = String(seconds).padStart(2, '0');

            // 将组合好的时间写入网页
            document.getElementById('timer').textContent = `${formatHours}:${formatMinutes}:${formatSeconds}`;
        }

        // 每隔 1 秒（1000毫秒）调用一次 updateTimer 函数
        setInterval(updateTimer, 1000);

        // 初始化执行一次，避免第一秒出现空白
        updateTimer();
    </script>
</body>
</html>
